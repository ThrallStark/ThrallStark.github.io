    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #020617 0%, #081021 30%, #0f1a30 70%, #1a253c 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #e2e8f0;
        }
        
        .project-page {
            min-height: 100vh;
            padding: 100px 24px 60px;
        }
        
        .container {
            max-width: 780px;
            margin: 0 auto;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .gold-line {
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, #06b6d4, #8b5cf6);
            margin: 0 auto 16px;
            border-radius: 2px;
        }
        
        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 12px;
        }
        
        .page-header p {
            color: #64748b;
            font-size: 1rem;
        }
        
        .placeholder-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(71, 85, 105, 0.25);
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
        }
        
        .placeholder-card .icon {
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        
        .placeholder-card h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: white;
            margin-bottom: 12px;
        }
        
        .placeholder-card p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        /* 返回首页按钮 - 统一尺寸，适配深色背景 */
        .back-home-btn {
            /* 固定尺寸 */
            width: 120px;
            height: 36px;
            padding: 8px 16px;
            box-sizing: border-box;
            
            /* 统一样式 */
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            border-radius: 20px;
            
            /* 布局 */
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            
            /* 颜色适配深色背景 */
            background: #06b6d4;
            color: white;
            border: none;
            box-shadow: 0 2px 8px rgba(6, 182, 212, 0.4);
            
            /* 交互效果 */
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .back-home-btn::before {
            content: "←";
            font-size: 16px;
        }

        .back-home-btn:hover {
            background: #0891b2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.6);
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .page-header h1 { font-size: 1.8rem; }
            .page-header { margin-bottom: 40px; }
            .placeholder-card { padding: 48px 28px; }
            .placeholder-card h2 { font-size: 1.2rem; }
            
            .back-home-btn {
                top: auto !important;
                left: auto !important;
                bottom: 24px;
                right: 24px;
                width: 48px;
                height: 48px;
                padding: 0 !important;
                border-radius: 50%;
                background: #06b6d4;
                color: white;
                font-size: 0;
                box-shadow: 0 4px 14px rgba(6,182,212,0.35);
                z-index: 90;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .back-home-btn::before {
                font-size: 20px !important;
                margin: 0 !important;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100%;
            }
        }
        
        @media (hover: hover) {
            .back-home-btn:hover {
                background: #0891b2;
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(6, 182, 212, 0.6);
            }
        }
    </style>
